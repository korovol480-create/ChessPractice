
name: Build ChessPractice APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ChessPractice-Android-Project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses || true

      - name: Install Android packages
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Extract project
        run: unzip -o ChessPractice-Android-Project.zip -d .

      - name: Build APK
        run: gradle --no-daemon -p ChessPractice assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessPractice-APK
          path: ChessPractice/app/build/outputs/apk/debug/app-debug.apk
          

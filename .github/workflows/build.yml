
name: Build ChessPractice APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ChessPractice-Android-Project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          accept-android-sdk-licenses: true

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract project
        run: unzip -o ChessPractice-Android-Project.zip -d .

      - name: Build APK
        run: gradle --no-daemon -p ChessPractice assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessPractice-APK
          path: ChessPractice/app/build/outputs/apk/debug/app-debug.apk
          
